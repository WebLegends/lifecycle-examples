environment:
  autoDeploy: true
  defaultServices:
    - name: "frontend"

services:
  - name: "frontend"
    defaultUUID: "dev-0"
    github:
      repository: 'WebLegends/signatpolicyai'
      branchName: 'docker-deploy'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'latest'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 3000
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
          
