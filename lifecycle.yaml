environment:
  autoDeploy: true
  defaultServices:
    - name: "piefrontend"
  optionalServices:
    - name: "frontend"
    - name: "backend"
    - name: "cache"

services:
  - name: "frontend"
    defaultUUID: "dev-0"
    github:
      repository: 'WebLegends/lifecycle-examples'
      branchName: 'main'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'main'
        app:
          dockerfilePath: 'Dockerfile.frontend'
          ports:
            - 3000
          env:
            COMPONENT: "app"
            ENV: "lifecycle"
            API_URL: "https://{{{backend_publicUrl}}}"
            CACHE_URL: "{{{cache_internalHostname}}}"
            WES_IS: "GOAT"
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'

  - name: "piefrontend"
    defaultUUID: "pie-dev-1"
    github:
      repository: 'WebLegends/signatpolicyai@feature/working-on-docker-suppor'
      branchName: 'feature/working-on-docker-support'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'latest'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 3000
          env:
            COMPONENT: "app"
            ENV: "lifecycle"
            DATABASE_URL: "postgresql://signatai_owner:9IkiqCnNY4wr@ep-weathered-firefly-a5tqlqlq.us-east-2.aws.neon.tech/signatai?sslmode=require"
            CLERK_SECRET_KEY: "sk_test_5Po9ye7JsrVQhoWxvcHP1lAAXeN6h1WcQEcFvNxjuk"
            SIGNAT_EPIC_API_URL: "https://signataiepicfunc.azurewebsites.net/api"
            SIGNAT_POLICY_API_USERNAME: "signat"
            SIGNAT_POLICY_API_PASSWORD: "plrkIg7y7DI1"
            CRON_SECRET: "q8fsg3yfK1KuKYaEQMQoisfy"
            MAILGUN_DOMAIN: "mg.legendari.tech"
            MAILGUN_EMAIL_FROM: "noreplay@legendari.tech"
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_cGxlYXNhbnQtbXVzdGFuZy0yMS5jbGVyay5hY2NvdW50cy5kZXYk"
            NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
            NEXT_PUBLIC_ABLY_API_KEY: "yzvXHA.RJBkQA:-oW7-TmY9iBokSGohtUcgZbURWhoOljEjC-4x1O41hg"
            NEXT_PUBLIC_BYTESCALE_APIKEY: "public_FW25c87As5Ydp31ytgwjYkDJwFsn"
            SIGNATAI_API_ENV: "dev"
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'

  - name: "backend"
    requires:
      - name: "db"
    defaultUUID: "dev-0"
    docker:
      dockerImage: "lifecycleoss/example-backend"
      defaultTag: "0.1.0"
      ports:
        - 8080
      env:
        COMPONENT: "server"
        ENV: "lifecycle"
        DATABASE_URL: "{{{db_internalHostname}}}"
        DATABASE_PORT: "5432"
      deployment:
        public: true
        readiness:
          tcpSocketPort: 8080
          
  - name: "db"
    defaultUUID: "dev-0"
    docker:
      dockerImage: "lifecycleoss/example-db"
      defaultTag: "0.1.0"
      ports:
        - 5432
      env:
        COMPONENT: "db"
        ENV: "lifecycle"
        POSTGRES_DB: tasks
        POSTGRES_USER: lifecycle
        POSTGRES_PASSWORD: mysecretpassword
      deployment:
        public: false
        readiness:
          tcpSocketPort: 5432
          
  - name: "cache"
    defaultUUID: "dev-0"
    docker:
      dockerImage: "redis"
      defaultTag: "8.0.2"
      ports:
        - 6379
      env:
        COMPONENT: "cache"
        ENV: "lifecycle"
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
