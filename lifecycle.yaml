environment:
  autoDeploy: true
  optionalServices:
    - name: "frontend"
    - name: "api"
    - name: "redis"

services:

  - name: "frontend"
    defaultUUID: "frontend-dev-0"
    github:
      repository: "WebLegends/signatpolicyai"
      branchName: "docker-deploy"
      docker:
        builder:
          engine: "buildkit"
        defaultTag: "main"
        app:
          dockerfilePath: "Dockerfile"
          ports:
            - 3000
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'

  - name: "api"
    requires:
      - name: "redis"
    defaultUUID: "api-dev-0"
    github:
      repository: "WebLegends/signat-ai-api"
      branchName: "docker-deploy"
      docker:
        builder:
          engine: "buildkit"
        defaultTag: "main"
        app:
          dockerfilePath: "api/Dockerfile"
          ports:
            - 80
      deployment:
        public: false
        readiness:
          tcpSocketPort: 80
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'

          
  - name: "redis"
    defaultUUID: "redis-dev-0"
    docker:
      dockerImage: "redis"
      defaultTag: "8.0.2"
      ports:
        - 6379
      env:
        COMPONENT: "cache"
        ENV: "lifecycle"
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
