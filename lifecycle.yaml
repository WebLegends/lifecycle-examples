environment:
  autoDeploy: true
  defaultServices:
    - name: "frontend"
  optionalServices:
    - name: "backend"

services:
  - name: "frontend"
    defaultUUID: "pie-frontend-1"
    github:
      repository: 'WebLegends/signatpolicyai'
      branchName: 'docker-deploy'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'latest'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 3000
          env:
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'

  - name: "backend"
    requires:
      - name: "db"
    defaultUUID: "dev-0"
    docker:
      dockerImage: "lifecycleoss/example-backend"
      defaultTag: "0.1.0"
      ports:
        - 8080
      env:
        COMPONENT: "server"
        ENV: "lifecycle"
        DATABASE_URL: "{{{db_internalHostname}}}"
        DATABASE_PORT: "5432"
      deployment:
        public: true
        readiness:
          tcpSocketPort: 8080
          
