environment:
  autoDeploy: true
  optionalServices:
    - name: "frontend"
    - name: "api"
    - name: "worker"
    - name: "redis"

services:

  - name: "frontend"
    defaultUUID: "frontend-dev-0"
    github:
      repository: "WebLegends/signatpolicyai"
      branchName: "docker-deploy"
      docker:
        builder:
          engine: "buildkit"
        defaultTag: "main"
        app:
          dockerfilePath: "Dockerfile"
          ports:
            - 3000
          env:
            SIGNATAI_API_ENDPOINT: "http://{{{api_internalHostname}}}"
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'

  - name: "api"
    requires:
      - name: "redis"
    defaultUUID: "api-dev-0"
    github:
      repository: "WebLegends/signat-ai-api"
      branchName: "docker-deploy"
      docker:
        builder:
          engine: "buildkit"
        defaultTag: "main"
        app:
          dockerfilePath: "api/Dockerfile"
          ports:
            - 80
          env:
            CELERY_BROKER_URL: "redis://{{{redis_internalHostname}}}:6379"
            CELERY_RESULT_BACKEND: "redis://{{{redis_internalHostname}}}:6379"
      deployment:
        public: false
        readiness:
          tcpSocketPort: 80
        hostnames:
          defaultInternalHostname: 'frontend-dev-0'
#        serviceDisks:
#          - name: 'apivolume1'
#            mountPath: '/etc/api'
#            accessModes: 'ReadWriteOnce'
#            storageSize: '10Gi'
#            medium: 'gp2'


  - name: "worker"
    requires:
      - name: "redis"
    defaultUUID: "worker-dev-0"
    github:
      repository: "WebLegends/signat-ai-api"
      branchName: "docker-deploy"
      docker:
        builder:
          engine: "buildkit"
        defaultTag: "main"
        app:
          dockerfilePath: "celeryqueue/Dockerfile"
          command: "celery -A tasks worker -l info -E"
          ports:
            - 80
          env:
            CELERY_BROKER_URL: "redis://{{{redis_internalHostname}}}:6379"
            CELERY_RESULT_BACKEND: "redis://{{{redis_internalHostname}}}:6379"
      deployment:
        public: false
        readiness:
          tcpSocketPort: 80
        hostnames:
          defaultInternalHostname: 'worker-dev-0'
#        serviceDisks:
#          - name: 'queuevolume1'
#            mountPath: '/etc/queue'
#            accessModes: 'ReadWriteOnce'
#            storageSize: '10Gi'
#            medium: 'gp2'

          
  - name: "redis"
    defaultUUID: "redis-dev-0"
    docker:
      dockerImage: "redis"
      defaultTag: "8.0.2"
      ports:
        - 6379
      env:
        COMPONENT: "cache"
        ENV: "lifecycle"
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
